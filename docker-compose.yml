services:
  db:
    image: postgres:15-alpine
    container_name: pizzeria-db
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
      POSTGRES_DB: pizzeria
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizzeria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
